name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Benchmark
        run: simulador-de-cliente benchmark --saida benchmark.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.md
